<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Magpie header logo: dark rounded tile + slate bird, sky wing/beak (matches public/favicon.svg's palette). -->
  <rect width="64" height="64" rx="14" fill="#0b0f14"/>
  <!-- tail: long, tapered, to the lower right -->
  <polygon points="37,29.5 58,54.5 56.5,57.5 32.5,39" fill="#f8fafc"/>
  <!-- body: upright perch, long axis toward the head -->
  <ellipse cx="33" cy="28" rx="11.5" ry="8.5" transform="rotate(38 33 28)" fill="#f8fafc"/>
  <!-- head -->
  <circle cx="21" cy="18" r="7" fill="#f8fafc"/>
  <!-- beak -->
  <polygon points="14.6,16.6 7,19.4 14.6,21.6" fill="#38bdf8"/>
  <!-- eye -->
  <circle cx="19.5" cy="16.8" r="1.5" fill="#0b0f14"/>
  <!-- wing: swept back toward the tail -->
  <path d="M 26.5 21.5 C 33 20.5 40 25 43.5 33.5 C 37 32.5 30 28.5 26 25.5 Z" fill="#38bdf8"/>
</svg>
